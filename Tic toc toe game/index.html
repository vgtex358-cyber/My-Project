<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toi Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="winner-container hide">
        <h1 id="winner">Winner</h1>
        <button class="new-btn">
          New Game
        </button>
      </div>
        <h1 class="game-name">Tic Tac Toe Game</h1>
      <div class="game">
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button
        ><button class="box"></button>
        <button class="box"></button
        ><button class="box"></button>
      </div>
      <button id="reset-btn">Reset Btn</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
